name: EXP003 J10 Goals Freeze
on:
  push:
    paths:
      - 'exp003_recovery/j10_expanded_replay.py'
      - '.github/workflows/j10-goals-freeze.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  j10-goals-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run J10 goal model
        working-directory: exp003_recovery
        shell: bash
        run: |
          set -o pipefail
          python j10_expanded_replay.py | tee j10_expanded_goal_output.txt
      - name: Persist J10 goal output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exp003_recovery/j10_expanded_goal_output.txt
          git diff --cached --quiet && exit 0
          git commit -m "EXP003: freeze J10 goal-model output"
          git push
