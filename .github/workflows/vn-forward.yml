name: Vn 2026 Forward Model
on:
  workflow_dispatch:
  push:
    paths:
      - 'exp003_recovery/vn2026_forward.py'
      - '.github/workflows/vn-forward.yml'
jobs:
  run-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas lxml requests
      - name: Run cutoff-safe forward model
        run: python exp003_recovery/vn2026_forward.py 2026-09-13T16:10:00
