name: EXP003 J13 Model-Only Replay
on:
  push:
    paths:
      - 'exp003_recovery/j13_model_only_replay.py'
      - 'exp003_recovery/parlay_replay_dc.py'
      - '.github/workflows/j13-model-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  j13-model-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run J13 model-only pre-context replay
        working-directory: exp003_recovery
        shell: bash
        run: |
          set -o pipefail
          python j13_model_only_replay.py | tee j13_model_only_output.txt
      - name: Upload J13 model-only output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j13-model-only-output
          path: exp003_recovery/j13_model_only_output.txt
