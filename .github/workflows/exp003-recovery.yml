name: EXP003 Recovery Gate
on:
  push:
    paths:
      - 'exp003_recovery/**'
      - '.github/workflows/exp003-recovery.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run optimizer/rho diagnostics
        run: python exp003_recovery/diagnose_optimizer.py
