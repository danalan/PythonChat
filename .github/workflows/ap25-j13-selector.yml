name: EXP003 Apertura 2025 J13 Selector
on:
  push:
    paths:
      - 'exp003_recovery/ap25_j13_windowed_selector_v2_1_v2_2.py'
      - 'exp003_recovery/ap25_j13_model_output.txt'
      - 'exp003_recovery/ap25_j13_price_snapshot_pre_cutoff.json'
      - '.github/workflows/ap25-j13-selector.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run J13 selector
        working-directory: exp003_recovery
        run: python ap25_j13_windowed_selector_v2_1_v2_2.py | tee ap25_j13_selection_output.json
      - name: Commit selector output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exp003_recovery/ap25_j13_selection_output.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Apertura 2025 J13 selector output"
          git pull --rebase origin main
          git push origin HEAD:main
