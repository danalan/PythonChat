name: EXP003 Apertura 2025 J6 Model Only
on:
  push:
    paths:
      - 'exp003_recovery/ap25_j6_model_only_replay.py'
      - 'exp003_recovery/parlay_replay_dc.py'
      - '.github/workflows/ap25-j6-model.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run deterministic J6 model replay
        working-directory: exp003_recovery
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          python ap25_j6_model_only_replay.py | tee ap25_j6_model_output.txt
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ap25-j6-model-output
          path: exp003_recovery/ap25_j6_model_output.txt
      - name: Commit deterministic output
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exp003_recovery/ap25_j6_model_output.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record Apertura 2025 J6 model output"
          git push
