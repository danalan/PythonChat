name: EXP003 Apertura 2025 J3 Windowed Selector
on:
  push:
    paths:
      - 'exp003_recovery/ap25_j3_windowed_selector_v2_1.py'
      - 'exp003_recovery/ap25_j3_price_snapshot_pre_cutoff.json'
      - 'exp003_recovery/ap25_j3_model_only_replay.py'
      - 'exp003_recovery/parlay_replay_dc.py'
      - '.github/workflows/ap25-j3-windowed-selector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run deterministic J3 selector
        working-directory: exp003_recovery
        shell: bash
        run: |
          set -o pipefail
          python ap25_j3_windowed_selector_v2_1.py | tee ap25_j3_windowed_selection_output.txt
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ap25-j3-windowed-selection-output
          path: exp003_recovery/ap25_j3_windowed_selection_output.txt
