name: EXP003 Apertura 2025 J1 Model-Only Replay
on:
  push:
    paths:
      - 'exp003_recovery/ap25_j1_model_only_replay.py'
      - 'exp003_recovery/parlay_replay_dc.py'
      - '.github/workflows/ap25-j1-model.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ap25-j1-model-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run Apertura 2025 J1 model-only replay
        working-directory: exp003_recovery
        shell: bash
        run: |
          set -o pipefail
          python ap25_j1_model_only_replay.py | tee ap25_j1_model_only_output.txt
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ap25-j1-model-only-output
          path: exp003_recovery/ap25_j1_model_only_output.txt
