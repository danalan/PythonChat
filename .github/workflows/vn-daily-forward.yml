name: Vn Daily Forward Request

on:
  push:
    paths:
      - 'exp003_recovery/forward_requests/*.json'
      - 'exp003_recovery/daily_forward_request.py'
      - '.github/workflows/vn-daily-forward.yml'

permissions:
  contents: write

jobs:
  run-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas lxml requests
      - name: Run dual-track integrity regression tests
        working-directory: exp003_recovery
        run: python test_dual_track_integrity.py
      - name: Run C0.1 corners shadow tests
        working-directory: exp003_recovery
        run: python test_corner_shadow.py
      - name: Run newest frozen forward request
        shell: bash
        run: |
          REQUEST=$(find exp003_recovery/forward_requests -maxdepth 1 -name '*.json' | sort | tail -1)
          echo "REQUEST=$REQUEST"
          python exp003_recovery/daily_forward_request.py "$REQUEST"
      - name: Commit immutable forward freeze
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exp003_recovery/forward_freezes/*_vn_daily.json
          if git diff --cached --quiet; then
            echo "No new freeze to commit"
          else
            git commit -m "Freeze daily Vn forward state run"
            git push
          fi
