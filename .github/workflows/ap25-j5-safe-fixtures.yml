name: EXP003 Apertura 2025 J5 Safe Fixtures
on:
  push:
    paths:
      - 'exp003_recovery/safe_ap25_fixture_discovery.py'
      - '.github/workflows/ap25-j5-safe-fixtures.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Discover J5 fixtures without outcomes
        working-directory: exp003_recovery
        shell: bash
        run: |
          set -o pipefail
          python safe_ap25_fixture_discovery.py --start 2025-08-15 --end 2025-08-18 --expected 9 | tee ap25_j5_safe_fixtures.txt
      - name: Commit safe fixture output
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exp003_recovery/ap25_j5_safe_fixtures.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record Apertura 2025 J5 safe fixture list"
          git push
